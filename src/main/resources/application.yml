spring:
  application:
    name: dine-reserve-api
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        connection:
          provider_disables_autocommit: true
    open-in-view: false
    generate-ddl: false
    show-sql: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 200
        one-indexed-parameters: true
        page-parameter: page
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      location: /data/dinereserve/files

dinereserve:
  filePath: /data/dinereserve/files

jwt:
  token:
    expiration_time: 3600000    # 1시간
    secret: w8ddX3cXobXTVKxqNde2XdTYhhkahA38ZFFTQ84enafcX3gb

---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/dinereserve?autoReconnect=true&characterEncoding=UTF-8
    username: dineUser
    password: dinePassword
    hikari:
      maximum-pool-size: 50
      max-lifetime: 28798000
      auto-commit: false
      connection-timeout: 10000
      transaction-isolation: TRANSACTION_READ_COMMITTED
      leak-detection-threshold: 5000

  data:
    redis:
      port: 6379
      host: localhost
      password:
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 2

  servlet:
    multipart:
      location: /Users/kimdy/data/workSpace/sampleData/dinereserve/files

dinereserve:
  filePath: /Users/kimdy/data/workSpace/sampleData/dinereserve/files

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
  api-docs:
    enabled: true
  override-with-generic-response: false

server:
  port: 5480

logging:
  level:
    root: error
    com.project.dine.reserve: debug
    org.hibernate.resource: info
    com.zaxxer.hikari.pool.HikariPool: debug
    com.zaxxer.hikari: trace
  dir: /Users/kimdy/data/workSpace/sampleData/dinereserve/logs

